name: Build & Release Android (LinguaFox)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, Verify & Publish Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies (npm ci)
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --run

      - name: 🔍 ESLint check
        run: npm run lint

      - name: 🧪 TypeScript check
        run: npx tsc --noEmit

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Configuración Android (Release Signing)
        run: node scripts/configure-android-signing.js

      - name: 🔐 Reconstrucción segura de Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: 🔨 Build Android App Bundle (AAB Release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: 🛡️ Verificación Criptográfica del AAB
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ ERROR: No se generó el archivo AAB en $AAB_PATH"
            exit 1
          fi

          echo "✅ AAB generado encontrado:"
          ls -lh "$AAB_PATH"

          EXPECTED_SHA256="37:38:1D:5F:F3:92:27:BE:BC:2F:61:82:35:32:1B:49:AB:EB:8A:DE:CC:92:FA:B8:F2:AD:9E:2F:DB:8E:BE:BF"
          CERT_INFO=$(keytool -printcert -jarfile "$AAB_PATH")
          ACTUAL_SHA256=$(echo "$CERT_INFO" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')

          echo "Firma SHA-256 esperada: $EXPECTED_SHA256"
          echo "Firma SHA-256 obtenida: $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ ERROR CRÍTICO: La huella digital SHA-256 del certificado NO coincide con la keystore oficial de EAS."
            echo "Se aborta la ejecución para proteger Google Play Console."
            exit 1
          fi

          echo "✅ Firma verificada con éxito: coincide 100% con EAS."
          cp "$AAB_PATH" "LinguaFox-Release.aab"

      - name: 🧹 Limpieza segura de Keystore temporal
        if: always()
        run: |
          rm -f android/app/release.keystore

      - name: 📤 Upload Artifact (LinguaFox-Release.aab)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LinguaFox-Release.aab
          path: LinguaFox-Release.aab
          retention-days: 30

      - name: 🚀 Google Play Internal Testing
        if: success() && env.PLAY_SECRET != ''
        env:
          PLAY_SECRET: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kepabilbao.linguafox
          releaseFiles: LinguaFox-Release.aab
          track: internal
          status: completed

      - name: ℹ️ Aviso Estado Google Play API
        if: success() && env.PLAY_SECRET == ''
        env:
          PLAY_SECRET: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "================================================================"
          echo "ℹ️ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON no está configurado."
          echo "✅ El archivo 'LinguaFox-Release.aab' ha sido generado y firmado con éxito."
          echo "✅ Puedes descargarlo de los Artifacts de este workflow y subirlo manualmente a Google Play Console."
          echo "ℹ️ En cuanto configures el secreto GOOGLE_PLAY_SERVICE_ACCOUNT_JSON en GitHub,"
          echo "   la subida automática a la pista 'internal' (Internal Testing) quedará activa."
          echo "================================================================"
