name: Build Android Release AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Build Android App Bundle (AAB) for Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies (npm ci)
        run: npm ci

      - name: 🧪 TypeScript static check
        run: npx tsc --noEmit

      - name: 🔍 ESLint check
        run: npm run lint

      - name: 🧪 Run tests (305 tests)
        run: npm test -- --run

      - name: 🩺 Run Expo Doctor
        run: npx expo-doctor

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android App Bundle (AAB) with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: ✅ Verify AAB was generated
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ ERROR: AAB file not found at $AAB_PATH"
            echo "Contents of android/app/build/outputs:"
            find android/app/build/outputs -type f 2>/dev/null || echo "Directory not found"
            exit 1
          fi
          echo "✅ AAB file found and verified"
          ls -lh "$AAB_PATH"
          echo "SHA-256: $(sha256sum "$AAB_PATH" | awk '{print $1}')"

      - name: 📤 Upload AAB as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linguafox-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: 🔴 Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            android/build/
            android/.gradle/
          retention-days: 3
