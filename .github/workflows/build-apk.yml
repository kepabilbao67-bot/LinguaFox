name: Compilar APK Autónomo (LinguaFox Preview)

on:
  push:
    branches:
      - feat/ci-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar dependencias exactas
        run: npm ci

      - name: 🧪 Comprobar tipos estáticos (TypeScript)
        run: npx tsc --noEmit

      - name: 🔍 Comprobar linter (ESLint)
        run: npm run lint

      - name: 🧪 Ejecutar batería completa de pruebas (57 tests)
        run: npm run test

      - name: 🩺 Ejecutar Expo Doctor
        run: npx expo-doctor

      - name: ⚙️ Generar proyecto nativo Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compilar APK Release Autónomo con Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: 🛡️ Validar APK, Bundle Hermes y Application ID
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          # 1. Comprobar que el archivo APK existe
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR FATAL: El archivo $APK_PATH no existe."
            exit 1
          fi

          # 2. Comprobar tamaño mínimo razonable del APK (mínimo 10 MB)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$APK_SIZE" -lt 10485760 ]; then
            echo "❌ ERROR FATAL: El APK pesa menos de 10 MB ($APK_SIZE bytes), está incompleto."
            exit 1
          fi

          # 3. Comprobar que contiene el bundle JS offline en el índice zip
          unzip -l "$APK_PATH" | grep -q "assets/index.android.bundle"
          if [ $? -ne 0 ]; then
            echo "❌ ERROR FATAL: assets/index.android.bundle no está presente en el APK."
            exit 1
          fi

          # 4. Extraer y verificar el bundle binario compilado con Hermes
          mkdir -p /tmp/apk_check
          unzip -p "$APK_PATH" "assets/index.android.bundle" > /tmp/apk_check/bundle.bin

          BUNDLE_SIZE=$(stat -c%s "/tmp/apk_check/bundle.bin")
          if [ "$BUNDLE_SIZE" -lt 512000 ]; then
            echo "❌ ERROR FATAL: El bundle JS es demasiado pequeño ($BUNDLE_SIZE bytes)."
            exit 1
          fi

          # 5. Comprobar la cabecera mágica de Hermes bytecode (c61fbc03) con Node.js
          node -e '
            const fs = require("fs");
            const buf = fs.readFileSync("/tmp/apk_check/bundle.bin");
            const magic = buf.subarray(0, 4).toString("hex");
            if (magic !== "c61fbc03") {
              console.error("❌ ERROR FATAL: Cabecera Hermes bytecode inválida:", magic);
              process.exit(1);
            }
            console.log("✅ Cabecera Hermes bytecode verificada con éxito (magic:", magic, ")");
          '

          # 6. Comprobar Application ID exacto mediante aapt del Android SDK
          AAPT_BIN=$(find $ANDROID_HOME/build-tools -name aapt | head -n 1)
          if [ -z "$AAPT_BIN" ]; then
            echo "❌ ERROR FATAL: No se encontró la herramienta aapt en el Android SDK."
            exit 1
          fi

          $AAPT_BIN dump badging "$APK_PATH" | grep -q "package: name='com.kepabilbao.linguafox'"
          if [ $? -ne 0 ]; then
            echo "❌ ERROR FATAL: El applicationId en el APK no coincide con com.kepabilbao.linguafox."
            exit 1
          fi

          # 7. Mostrar métricas finales del binario
          echo "=========================================="
          echo "✅ TODAS LAS VALIDACIONES SUPERADAS"
          echo "Tamaño del APK: $(ls -lh "$APK_PATH" | awk '{print $5}')"
          echo "Tamaño del bundle Hermes: $(ls -lh /tmp/apk_check/bundle.bin | awk '{print $5}')"
          echo "SHA-256: $(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "=========================================="

      - name: 📤 Subir APK autónomo como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFox-v1-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
